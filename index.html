<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>استمارة مسؤولي الحضور والغياب</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6f3f4; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #0a5f68; text-align: center; padding: 16px; }
  /* credentialless: يفتح الاستمارة بدون حسابات Google المسجّلة في المتصفح،
     فلا يظهر خطأ "يتعذر فتح الملف" في كروم عند وجود أكثر من حساب */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; }
  iframe.ready { opacity: 1; }
</style>
</head>
<body>
<div id="wait">كادر كليتنا الأعزاء أهلًا بكم، جارٍ تحضير الاستمارة.…</div>
<iframe credentialless title="استمارة مسؤولي الحضور والغياب"></iframe>
<script>
  const frame = document.querySelector('iframe');
  frame.onload = () => frame.classList.add('ready');
  frame.src = 'https://script.google.com/macros/s/AKfycbz_sXbi-8qp10adchzIFcutPHjjvC4ZE6kxdonY7miwTCVSe96t2jEvO0uD22lljH0/exec'; // يُضبط بعد credentialless حتى يُطبَّق من أول طلب
</script>
</body>
</html>
